name = "shopii-pro-checker"
main = "worker.js"
compatibility_date = "2024-01-01"

# For Pages deployment (recommended)
[pages]
build_output_dir = "./"

# Optional: Bindings if you need D1 or KV later
# [[d1_databases]]
# binding = "DB"
